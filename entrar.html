<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="src/header.css" />
  </head>
  <body>
    <header>
      <div class="header-box-1">
        <div class="logo">
          <img src="src/logoTechStore.png" />
        </div>
      </div>
      <div class="header-box-2">
        <div class="home"><a href="index.html">Home</a></div>
        <div class="produtos">
          <a href="#">Produtos<i class="fa-solid fa-chevron-down"></i></a>
        </div>
        <div class="servicos">
          <a href="#">Serviços<i class="fa-solid fa-chevron-down"></i></a>
        </div>
        <div class="sobre-carrinho">
          <a href="sobre.html"><i class="fa-regular fa-circle-question"></i></a>
          <a href="carrinho.html"><i class="fa-solid fa-cart-shopping"></i></a>
        </div>
        <div class="botoes">
          <button class="btn-entrar"><a href="entrar.html">Entrar</a></button>
          <button class="btn-criar-conta">
            <a href="criarConta.html">Criar Conta</a>
          </button>
        </div>
      </div>
    </header>
    <button class="voltar"><a href="index.html">Voltar</a></button>
    <section class="Login-form-wrapper">
      <form id="form-login" action="#" method="POST" class="cadastro-form">
        <fieldset>
          <legend>Entrar</legend>
          <div class="input-group">
            <label for="email">E-mail</label>
            <input
              type="email"
              id="email"
              name="email"
              required
              placeholder="seu@email.com"
            />
          </div>
          <div class="input-group">
            <label for="senha">Senha</label>
            <input
              type="password"
              id="senha"
              name="senha"
              required
              placeholder="Sua senha"
            />
          </div>
          <p><a href="#">Esqueceu sua senha?</a></p>
          <button type="submit" class="btn-submit">Entrar</button>
        </fieldset>
      </form>
    </section>
    <script src="src/script.js"></script>
  </body>
</html>
