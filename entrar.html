<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="src/header.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
  </head>
  <body>
    <header class="header">
      <div class="header-box-1">
        <div class="logo">
          <a href="index.html"><img src="src/logoTechStore.png" /></a>
        </div>
      </div>
      <div class="header-box-2">
        <div class="home"><a href="index.html">Home</a></div>
        <div class="produtos"><a href="#">Produtos<i class="fa-solid fa-chevron-down"></i></a></div>
        <div class="servicos"><a href="#">Serviços<i class="fa-solid fa-chevron-down"></i></a></div>
        <div class="sobre-carrinho">
          <a href="sobre.html"><i class="fa-regular fa-circle-question"></i></a>
          <a href="carrinho.html"><i class="fa-solid fa-cart-shopping"></i></a>
        </div>
        <div class="botoes">
          <button class="btn-entrar"><a href="entrar.html">Entrar</a></button>
          <button class="btn-criar-conta"><a href="criarConta.html">Criar Conta</a></button>
        </div>
      </div>
    </header>
    <section class="login-form-wrapper">
      <form id="form-login" action="#" method="POST" class="cadastro-form">
        <fieldset>
          <legend>Entrar</legend>
          <div class="input-group">
            <label for="email">E-mail</label>
            <input
              type="email"
              id="email"
              name="email"
              required
              placeholder="seu@email.com"
            />
          </div>
          <div class="input-group">
            <label for="senha">Senha</label>
            <input
              type="password"
              id="senha"
              name="senha"
              required
              placeholder="Sua senha"
            />
          </div>
          <button type="submit" class="btn-submit">Entrar</button>
          <button class="btn-criar"><a href="criarConta.html">Criar minha conta</a></button>
          <p><a href="#">Esqueceu sua senha?</a></p>
        </fieldset>
      </form>
    </section>
    <script src="src/script.js"></script>
  </body>
</html>
