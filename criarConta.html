<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Conta - TechStore</title>
    <link rel="stylesheet" href="src/header.css">
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
</head>
<body>
    <header class="header">
      <div class="header-box-1">
        <div class="logo">
          <a href="index.html"><img src="src/res/logoTechStore.png" /></a>
        </div>
      </div>
      <div class="header-box-2">
        <div class="home"><a href="index.html">Home</a></div>
        <div class="produtos"><a href="#">Produtos<i class="fa-solid fa-chevron-down"></i></a></div>
        <div class="servicos"><a href="#">Serviços<i class="fa-solid fa-chevron-down"></i></a></div>
        <div class="sobre-carrinho">
          <a href="sobre.html"><i class="fa-regular fa-circle-question"></i></a>
          <a href="carrinho.html"><i class="fa-solid fa-cart-shopping"></i></a>
        </div>
        <div class="botoes">
          <button class="btn-entrar"><a href="entrar.html">Entrar</a></button>
          <button class="btn-criar-conta"><a href="criarConta.html">Criar Conta</a></button>
        </div>
      </div>
    </header>
    <section class="login-form-wrapper">
      <form id="form-criar-conta" action="#" method="POST" class="cadastro-form">
        <fieldset>
          <legend>Criar Conta</legend>
          <div class="input-group">
            <label for="nome">Nome Completo</label>
            <input
              type="text"
              id="nome"
              name="nome"
              required
              placeholder="Seu nome completo"
            />
          </div>
          <div class="input-group">
            <label for="email">E-mail</label>
            <input
              type="email"
              id="email"
              name="email"
              required
              placeholder="seu@email.com"
            />
          </div>
          <div class="input-group">
            <label for="senha">Senha</label>
            <input
              type="password"
              id="senha"
              name="senha"
              required
              placeholder="Sua senha"
            />
          </div>
          <div class="input-group">
            <label for="confirma-senha">Confirmar Senha</label>
            <input
              type="password"
              id="confirma-senha"
              name="confirmaSenha"
              required
              placeholder="Confirme sua senha"
            />
          </div>
          <button type="submit" class="btn-submit">Criar Minha Conta</button>
          <button type="button" class="btn-criar" onclick="window.location.href='entrar.html'">Já tenho uma conta</button>
        </fieldset>
      </form>
    </section>
    <script src="src/script.js"></script>
</body>
</html>
